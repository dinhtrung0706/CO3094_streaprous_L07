# Central chat backend. Add more proxy_pass targets only with shared backend state.
host "app1.local" {
    proxy_pass http://192.168.2.118:9000;
    proxy_transport standard;
    dist_policy round-robin;
}

# Allow browsers connecting to the proxy by IP address as well.
host "*" {
    proxy_pass http://127.0.0.1:9000;
    proxy_transport session;
}

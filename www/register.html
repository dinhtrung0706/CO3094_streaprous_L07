<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | StreapRous Chat</title>
  <link rel="stylesheet" href="/static/css/chat.css">
  <script src="/static/js/auth.js" defer></script>
</head>
<body class="auth-page" data-auth-page="register">
  <main class="auth-card" aria-labelledby="authTitle">
    <div class="auth-icon" aria-hidden="true">SR</div>
    <p class="eyebrow">CO3094 · Hybrid Chat</p>
    <h1 id="authTitle">Create account</h1>
    <p class="subtle">Use a 3–32 character username and a password of at least 8 UTF-8 bytes.</p>
    <p id="authStatus" class="status-line" role="status" aria-live="polite"></p>
    <form id="authForm" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9_.-]{2,31}" title="3–32 characters: letters, digits, period, underscore, or dash" required autofocus placeholder="Example: alice">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required placeholder="At least 8 UTF-8 bytes">
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required placeholder="Enter password again">
      <button id="authSubmit" type="submit" class="button primary wide">Create account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="/login.html">Sign in</a></p>
  </main>
</body>
</html>

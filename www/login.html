<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | StreapRous Chat</title>
  <link rel="stylesheet" href="/static/css/chat.css">
  <script src="/static/js/auth.js" defer></script>
</head>
<body class="auth-page" data-auth-page="login">
  <main class="auth-card" aria-labelledby="authTitle">
    <div class="auth-icon" aria-hidden="true">SR</div>
    <p class="eyebrow">CO3094 · Hybrid Chat</p>
    <h1 id="authTitle">Sign in</h1>
    <p class="subtle">Sign in to the central server to send and receive messages.</p>
    <p id="authStatus" class="status-line" role="status" aria-live="polite"></p>
    <form id="authForm" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" required autofocus placeholder="Example: alice">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter password">
      <button id="authSubmit" type="submit" class="button primary wide">Sign in</button>
    </form>
    <p class="auth-switch">No account yet? <a href="/register.html">Sign up</a></p>
  </main>
</body>
</html>
